name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22        # usa la versión que exija Angular 22
          cache: npm

      - run: npm ci

      - name: Generar environment de producción
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat > src/environments/environment.ts <<EOF
          export const environment = {
            production: true,
            supabaseUrl: '${SUPABASE_URL}',
            supabaseKey: '${SUPABASE_ANON_KEY}',
          };
          EOF

      - name: Build
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"

      # Fallback SPA: al recargar una ruta, GitHub Pages sirve 404.html (= index.html)
      - name: Copiar index.html a 404.html
        run: cp dist/cadentia/browser/index.html dist/cadentia/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/cadentia/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
