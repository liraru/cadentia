name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build --configuration production --base-href /cadentia/

      - name: Preparar salida estática (index.html + 404.html)
        run: |
          OUT=dist/cadentia/browser
          echo "Contenido de $OUT:"
          ls -la "$OUT"

          if [ ! -f "$OUT/index.html" ]; then
            if [ -f "$OUT/index.csr.html" ]; then
              echo "No hay index.html; se usa index.csr.html"
              cp "$OUT/index.csr.html" "$OUT/index.html"
            else
              echo "::error::El build no ha generado index.html ni index.csr.html en $OUT"
              exit 1
            fi
          fi

          cp "$OUT/index.html" "$OUT/404.html"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/cadentia/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
